name = "t18"
main = "src/index.ts"
compatibility_date = "2024-05-01"
account_id = "545c9b44c3df46e24d2ae837aebfa7b6"
workers_dev = true

[vars]
ENVIRONMENT = "production"
STABLE_VERSION = "1.0.1"

[observability.logs]
enabled = true
invocation_logs = true

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "t18-mon-db"
database_id = "ded19daf-64c6-4f58-bda8-1ffa02ba99f1"
migrations_dir = "migrations"

# Cron trigger: Runs every day at 00:15 UTC for 30-day data rotation & daily summarization
[triggers]
crons = ["15 0 * * *"]
