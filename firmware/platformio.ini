; PlatformIO Project Configuration File for kreier/wifi
; Version: 0.4.0
; https://github.com/kreier/wifi

[platformio]
default_envs = t18
src_dir = src
include_dir = include

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D FIRMWARE_VERSION=\"0.4.0\"

; Target 1: T18 board (Status LED on GPIO 5)
[env:t18]
build_flags =
    ${env.build_flags}
    -D STATUS_LED_PIN=5
    -D BOARD_NAME=\"T18\"

; Target 2: Standard ESP32 DevKit V1 (Status LED on GPIO 2)
[env:devkitv1]
build_flags =
    ${env.build_flags}
    -D STATUS_LED_PIN=2
    -D BOARD_NAME=\"DevKitV1\"

; Target 3: T8 board (Status LED on GPIO 21)
[env:t8]
build_flags =
    ${env.build_flags}
    -D STATUS_LED_PIN=21
    -D BOARD_NAME=\"T8\"
